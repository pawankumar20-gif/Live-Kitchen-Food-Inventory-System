<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Live Kitchen - Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/auth.css">
</head>

<body>
    <div class="auth-container">
        <!-- Tabs Navigation -->
        <div class="auth-tabs">
            <button class="tab-btn active" data-tab="user-login" onclick="switchTab('user-login')">User Login</button>
            <button class="tab-btn" data-tab="admin-login" onclick="switchTab('admin-login')">Admin Login</button>
            <button class="tab-btn" data-tab="signup" onclick="switchTab('signup')">Sign Up</button>
        </div>

        <!-- User Login Tab -->
        <div id="user-login" class="auth-card active">
            <div class="auth-header">
                <h1>Live Kitchen</h1>
                <p>Food Inventory System</p>
            </div>

            <form id="userLoginForm" onsubmit="handleUserLogin(event)">
                <div class="form-group">
                    <label for="user-email">Email Address</label>
                    <input type="email" id="user-email" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label for="user-password">Password</label>
                    <input type="password" id="user-password" placeholder="Enter your password" required>
                </div>

                <div id="userErrorMessage" class="error-message"></div>

                <button type="submit" class="auth-btn user-btn">Sign In as User</button>
            </form>
        </div>

        <!-- Admin Login Tab -->
        <div id="admin-login" class="auth-card">
            <div class="auth-header">
                <h1>Live Kitchen</h1>
                <p>Admin Portal</p>
            </div>

            <form id="adminLoginForm" onsubmit="handleAdminLogin(event)">
                <div class="form-group">
                    <label for="admin-username">Admin ID</label>
                    <input type="text" id="admin-username" placeholder="Enter Admin ID" required>
                </div>

                <div class="form-group">
                    <label for="admin-password">Password</label>
                    <input type="password" id="admin-password" placeholder="Enter your password" required>
                </div>

                <div id="adminErrorMessage" class="error-message"></div>

                <button type="submit" class="auth-btn admin-btn">Sign In as Admin</button>
            </form>
        </div>

        <!-- Sign Up Tab -->
        <div id="signup" class="auth-card">
            <div class="auth-header">
                <h1>Create Account</h1>
                <p>Join Live Kitchen Community</p>
            </div>

            <form id="signupForm" onsubmit="handleSignUp(event)">
                <div class="form-group">
                    <label for="signup-name">Full Name</label>
                    <input type="text" id="signup-name" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label for="signup-email">Email Address</label>
                    <input type="email" id="signup-email" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label for="signup-password">Password</label>
                    <input type="password" id="signup-password" placeholder="Create a password" required>
                </div>

                <div class="form-group">
                    <label for="signup-confirm">Confirm Password</label>
                    <input type="password" id="signup-confirm" placeholder="Confirm your password" required>
                </div>

                <div id="signupErrorMessage" class="error-message"></div>

                <button type="submit" class="auth-btn signup-btn">Create Account</button>
            </form>

            <p class="signup-footer">Already have an account? <a href="#" onclick="switchTab('user-login'); return false;">Login here</a></p>
        </div>
    </div>

    <script src="js/auth-system.js"></script>
</body>

</html>
